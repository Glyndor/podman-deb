name: release

# Packages the newest stable upstream Podman, with the netavark and aardvark-dns
# it needs, as a signed .deb, with no human step. Every few hours it asks
# upstream for the newest stable tag of each of the three; if they differ from
# the latest release it verifies the tags, builds on Debian 13, smoke-tests the
# package, signs it and publishes it. The apt repository
# picks the release up on its next daily run. Any failed step stops the run
# before anything is published, so the previous release stays the latest.

on:
  schedule:
    - cron: "17 */6 * * *"
  # A change to how the package is built does not wait for the next tick: the plan
  # notices the new recipe and builds. A change to the keys that verify upstream,
  # or to this workflow, runs the plan too, which only builds if something is
  # missing; it is how a release that was refused for a missing key retries at
  # once, and how an edit to this file is exercised the moment it lands.
  push:
    branches: [main]
    paths:
      - "scripts/build/**"
      - "keyring/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/reusable-build.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    # Only main publishes. A dispatch from a branch would otherwise tag an
    # unreviewed commit as the release apt serves.
    if: github.ref == 'refs/heads/main'
    # ubuntu-latest resolved to ubuntu-26.04 in this repository's runs on 2026-11-20,
    # and ubuntu-24.04-arm to 24.04. The label is named so a change of image is a
    # commit; the arm64 build keeps its own label, so the rootless test covers both.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # Measured in this repository's runs: 6 to 8 seconds, with the six ls-remote calls
    # to upstream. The ten minutes is a ceiling, and it matters: this job holds the
    # release group, so a hang here holds every later run behind it.
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      version: ${{ steps.p.outputs.version }}
      build: ${{ steps.p.outputs.build }}
      podman: ${{ steps.p.outputs.podman }}
      netavark: ${{ steps.p.outputs.netavark }}
      aardvark: ${{ steps.p.outputs.aardvark }}
      recipe: ${{ steps.p.outputs.recipe }}
      podman_sha: ${{ steps.p.outputs.podman_sha }}
      netavark_sha: ${{ steps.p.outputs.netavark_sha }}
      aardvark_sha: ${{ steps.p.outputs.aardvark_sha }}
      previous_mldsa: ${{ steps.p.outputs.previous_mldsa }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether a new release is needed
        id: p
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          w="$RUNNER_TEMP/plan"; mkdir -p "$w"
          for c in podman netavark aardvark-dns; do
            echo "$c $(bash scripts/upstream/latest-stable.sh "https://github.com/containers/$c.git")" >> "$w/fresh"
          done
          # How the package is built counts as a component: upstream tags cannot
          # see a packaging fix, so without this one never produces a release.
          echo "recipe $(bash scripts/build/recipe-id.sh)" >> "$w/fresh"
          # Every tag the repository has, from git rather than from the release
          # list: a tag can exist without a release, and a window of the newest
          # releases would one day miss the revision the planner has to step past.
          git ls-remote --tags "https://github.com/$GH_REPO.git" \
            | sed 's#.*refs/tags/##; s#\^{}$##' | sort -u > "$w/tags"
          bash scripts/upstream/read-released.sh "$w/released" "$w/assets"
          bash scripts/upstream/plan-release.sh "$w/fresh" "$w/released" "$w/tags" >> "$GITHUB_OUTPUT"
          # Whether the newest release carries the second signature. From the first
          # release that does, the signing step refuses to publish one without it.
          [ -f "$w/assets" ] || { echo "the asset list of the newest release was not written" >&2; exit 1; }
          previous_mldsa=false
          if grep -q '\.mldsa65\.sig$' "$w/assets"; then previous_mldsa=true; fi
          echo "previous_mldsa=$previous_mldsa" >> "$GITHUB_OUTPUT"
          # The package version is the tag without its leading v; the build
          # workflow takes it as given, since an expression cannot strip it.
          tag="$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT")"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          for c in podman netavark aardvark-dns; do
            echo "${c%-dns}=$(awk -v c="$c" '$1 == c {print $2}' "$w/fresh")" >> "$GITHUB_OUTPUT"
          done
          echo "recipe=$(awk '$1 == "recipe" {print $2}' "$w/fresh")" >> "$GITHUB_OUTPUT"
          # The commit each tag points at right now, fixed here so both build
          # jobs check out exactly this and an upstream tag moved in between
          # cannot give the two architectures different sources.
          for c in podman netavark aardvark-dns; do
            tag="$(awk -v c="$c" '$1 == c {print $2}' "$w/fresh")"
            sha="$(git ls-remote "https://github.com/containers/$c.git" "refs/tags/$tag^{}" | awk '{print $1}')"
            [ -n "$sha" ] || { echo "$c $tag is not an annotated tag upstream" >&2; exit 1; }
            echo "${c%-dns}_sha=$sha" >> "$GITHUB_OUTPUT"
          done
          cat "$w/fresh"

  # The build itself lives in reusable-build.yml so that build-check.yml can run
  # the same steps on a pull request. Third-party code runs there, with
  # contents: read and no secrets; what it hands forward is the artifact
  # deb-<arch>, and the signing job never executes anything from it.
  build:
    name: Build ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    uses: ./.github/workflows/reusable-build.yml
    with:
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      version: ${{ needs.plan.outputs.version }}
      podman: ${{ needs.plan.outputs.podman }}
      netavark: ${{ needs.plan.outputs.netavark }}
      aardvark: ${{ needs.plan.outputs.aardvark }}
      podman_sha: ${{ needs.plan.outputs.podman_sha }}
      netavark_sha: ${{ needs.plan.outputs.netavark_sha }}
      aardvark_sha: ${{ needs.plan.outputs.aardvark_sha }}
      upload: true

  publish:
    name: Sign and publish
    needs: [plan, build]
    # The same guard as plan, on the job that holds the signing keys and creates the
    # release: a skipped plan already skips this one, and a later edit that makes this
    # job run whatever its needs did (an always() above it) would otherwise publish
    # from a branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Ceiling, not measured: a download of two packages, signing, the attestation and the
    # release. Like the plan it holds the release group while it runs.
    timeout-minutes: 15
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      PODMAN: ${{ needs.plan.outputs.podman }}
      NETAVARK: ${{ needs.plan.outputs.netavark }}
      AARDVARK: ${{ needs.plan.outputs.aardvark }}
      RECIPE: ${{ needs.plan.outputs.recipe }}
      PREVIOUS_MLDSA: ${{ needs.plan.outputs.previous_mldsa }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deb-*
          merge-multiple: true
          path: ${{ runner.temp }}/artifacts
      - name: Sign every package, then verify against the published key
        id: sign
        working-directory: ${{ runner.temp }}/artifacts
        env:
          GLYNDOR_RELEASE_ED25519_KEY: ${{ secrets.GLYNDOR_RELEASE_ED25519_KEY }}
          # The second, post-quantum key. A secret that is not configured
          # arrives as an empty string, which sign.py reads as unset: the
          # packages are then signed with Ed25519 alone, as before it existed.
          GLYNDOR_RELEASE_MLDSA65_KEY: ${{ secrets.GLYNDOR_RELEASE_MLDSA65_KEY }}
          PYTHONUTF8: "1"
        run: |
          if [ -z "$GLYNDOR_RELEASE_ED25519_KEY" ]; then
            echo "::error::GLYNDOR_RELEASE_ED25519_KEY is not configured; refusing to publish unsigned packages."
            exit 1
          fi
          [ "$(find . -maxdepth 1 -name 'podman_*.deb' | wc -l)" -eq 2 ] || { echo "::error::expected one package per architecture"; exit 1; }
          python3 -m venv "$RUNNER_TEMP/signvenv"
          py="$RUNNER_TEMP/signvenv/bin/python"
          "$py" -m pip install --quiet --require-hashes --only-binary=:all: -r "$GITHUB_WORKSPACE/.github/scripts/release/sign-requirements.txt"
          # The second signature is required by what the repository commits, not by a
          # setting nobody can read from here: once keyring/glyndor-release-mldsa65.b64
          # holds a public key, every package must leave with an ML-DSA-65 signature
          # that verifies against it. A secret that was lost, renamed or never set then
          # stops the run instead of publishing Ed25519 alone under an anchor that
          # promises both. A secret set with no public key committed is required too:
          # a signature nobody can check is refused. With neither, the check is the
          # Ed25519 one the release always had. Set the secret and merge the key one
          # after the other: a release built between the two stops, whichever came first.
          #
          # The committed key is one half; the other is what was already published. Once
          # the newest release carries an ML-DSA-65 signature, this one must too, so an
          # anchor emptied by a bad merge, a checkout or an editor stops the run instead
          # of quietly going back to Ed25519 alone. A rotation adds the new key before
          # it removes the old one, so the anchor never empties and nothing here stops
          # it. Retiring the second signature on purpose cannot be told from an accident
          # by this step, so there is no switch for it: it takes a reviewed change to
          # this rule, in the pull request that empties the anchor, saying why.
          case "$PREVIOUS_MLDSA" in
            true | false) ;;
            *) echo "::error::the plan did not say whether the newest release carries the second signature ('$PREVIOUS_MLDSA'); refusing to guess."; exit 1 ;;
          esac
          anchor="$GITHUB_WORKSPACE/keyring/glyndor-release-mldsa65.b64"
          [ -f "$anchor" ] || { echo "::error::$anchor is missing; refusing to publish without knowing whether the second signature is required."; exit 1; }
          # This step and verify-sig.py both decide what a line of that file is. The
          # verifier splits on every line break Python knows and this step on the line
          # feed alone, so a key behind a carriage return would be part of a comment
          # here and a key there, and the run would publish one signature under an
          # anchor that holds a key. The file is printable ASCII with line feeds, where
          # the two readers agree, or the run stops. The bytes are counted, not
          # matched line by line: GNU grep reads a file with a NUL in it as binary and
          # reports no match, which let such a file through as text.
          outside="$(LC_ALL=C tr -d ' -~\n' < "$anchor" | wc -c)"
          if [ "$outside" -ne 0 ]; then
            echo "::error::keyring/glyndor-release-mldsa65.b64 holds a byte that is neither printable ASCII nor a line feed; refusing to guess whether it holds a key."
            exit 1
          fi
          anchored=false
          if grep -q -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' "$anchor"; then anchored=true; fi
          if [ "$PREVIOUS_MLDSA" = true ] && [ "$anchored" = false ]; then
            echo "::error::the newest release carries an ML-DSA-65 signature and keyring/glyndor-release-mldsa65.b64 holds no key; refusing to publish this one with Ed25519 alone."
            exit 1
          fi
          if [ "$anchored" = true ] && [ -z "$GLYNDOR_RELEASE_MLDSA65_KEY" ]; then
            echo "::error::keyring/glyndor-release-mldsa65.b64 holds a public key and GLYNDOR_RELEASE_MLDSA65_KEY is not configured; refusing to publish with one signature."
            exit 1
          fi
          required=false
          require=()
          if [ -n "$GLYNDOR_RELEASE_MLDSA65_KEY" ] || [ "$PREVIOUS_MLDSA" = true ]; then
            required=true
            require=(--require-mldsa)
          fi
          for deb in podman_*.deb; do
            "$py" "$GITHUB_WORKSPACE/.github/scripts/release/sign.py" "$deb"
            "$py" "$GITHUB_WORKSPACE/.github/scripts/release/verify-sig.py" "$deb" "$deb.sig" "$GITHUB_WORKSPACE/keyring/glyndor-release-ed25519.b64" \
              --mldsa-sig "$deb.mldsa65.sig" --mldsa-keys "$anchor" "${require[@]}"
          done
          echo "require_mldsa=$required" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/artifacts/podman_*.deb
      - name: Create the release
        working-directory: ${{ runner.temp }}/artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUIRE_MLDSA: ${{ steps.sign.outputs.require_mldsa }}
        run: |
          printf 'podman %s\nnetavark %s\naardvark-dns %s\nrecipe %s\n' "$PODMAN" "$NETAVARK" "$AARDVARK" "$RECIPE" > components.txt
          # The ML-DSA-65 signatures are published whenever they exist. When the signing
          # step required them, one that is not here stops the run: a release is
          # immutable, and one without its second signature cannot be completed later.
          # Listed one by one so that, without them, the release carries exactly the
          # assets it always has.
          mldsa=()
          for deb in podman_*.deb; do
            if [ -e "$deb.mldsa65.sig" ]; then
              mldsa+=("$deb.mldsa65.sig")
            elif [ "$REQUIRE_MLDSA" = true ]; then
              echo "::error::$deb.mldsa65.sig is missing and the second signature is required; refusing to publish."
              exit 1
            fi
          done
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Podman ${TAG#v}" \
            --notes "Podman $PODMAN with netavark $NETAVARK and aardvark-dns $AARDVARK, each built from its upstream tag on Debian 13. The tag signatures were verified against the keys in containers/release-keys, and each package was installed and run before signing." \
            podman_*.deb podman_*.deb.sig "${mldsa[@]}" components.txt

  # A failed release leaves no other trace until the watchdog notices a day
  # later, so this opens the issue at once. A manual dispatch is somebody
  # watching the run, so it does not open one.
  alert:
    name: alert
    needs: [plan, build, publish]
    if: ${{ failure() && github.event_name != 'workflow_dispatch' }}
    # Only calls gh or reads strings: nothing here depends on the image.
    runs-on: ubuntu-latest
    permissions:
      issues: write
    # Ceiling, not measured: two gh calls.
    timeout-minutes: 5
    steps:
      - name: Open an issue, or add to the one that is open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Release run failed"
          body="A release run failed. Read the run: $RUN_URL"
          open="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --label type:bug --label prio:P1 --label area:release --body "$body"
          fi
